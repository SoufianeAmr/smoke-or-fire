# Render Blueprint: the verdict engine as a free web service over HTTPS.
# Render → New → Blueprint → pick this repo. The service URL is https://<name>.onrender.com.
#
# Free services sleep after 15 minutes without requests: an external ping (cron-job.org,
# GET /health every 10 minutes) keeps it awake.
#
# The engine reads ../data, and Render hides files outside a service's root directory,
# so the service root is the repo root and the commands run inside engine/.
# The disk is wiped on every deploy: after one, live wind takes a few minutes to load
# (/verdict?mode=live answers 503 until then). buildFilter skips deploys for web-only changes:
# Render applies it only to a service managed by this Blueprint. A service created on its own
# needs the same paths under Settings → Build & Deploy → Build Filters.
services:
  - type: web
    name: smoke-or-fire-engine
    runtime: python
    plan: free
    region: virginia
    # env -u: a UV_PYTHON_PREFERENCE left on the service clashes with Render's UV_NO_MANAGED_PYTHON.
    buildCommand: pip install uv && cd engine && env -u UV_PYTHON_PREFERENCE uv sync --frozen --no-dev
    startCommand: cd engine && .venv/bin/uvicorn smoke_engine.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - engine/**
        - data/**
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      # NASA FIRMS MAP_KEY: set its value in the Render dashboard, never in this file.
      - key: FIRMS_MAP_KEY
        sync: false
